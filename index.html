<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple JavaScript Playground</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Welcome to JavaScript Playground!</h1>
        
        <!-- Click Event Section -->
        <section class="box">
            <h2>Click Event</h2>
            <button id="click-me" class="btn">Click Me!</button>
            <p id="click-message"></p>
        </section>
        
        <!-- Hover Event Section -->
        <section class="box">
            <h2>Hover Event</h2>
            <div id="hover-box" class="hover-box">
                Hover over me!
            </div>
        </section>
        
        <!-- Keypress Event Section -->
        <section class="box">
            <h2>Keypress Event</h2>
            <p>Press any key on your keyboard</p>
            <p id="keypress-message"></p>
        </section>
        
        <!-- Simple Image Gallery -->
        <section class="box">
            <h2>Simple Image Gallery</h2>
            <div class="gallery">
                <img id="gallery-image" src="https://via.placeholder.com/400x200?text=Image+1" alt="Gallery image">
                <div class="gallery-controls">
                    <button id="prev-btn" class="btn">Previous</button>
                    <button id="next-btn" class="btn">Next</button>
                </div>
            </div>
        </section>
        
        <!-- Form Validation -->
        <section class="box">
            <h2>Form Validation</h2>
            <form id="simple-form">
                <div class="form-group">
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                    <p id="name-error" class="error-message"></p>
                </div>
                
                <div class="form-group">
                    <label for="email">Your Email:</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                    <p id="email-error" class="error-message"></p>
                </div>
                
                <button type="submit" class="btn submit-btn">Submit</button>
            </form>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
